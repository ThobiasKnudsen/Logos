[package]
name = "logos"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"

[dependencies]
winit = "0.30"
wgpu = "22"
glyphon = "0.6"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
taffy = "0.7"
log = "0.4"
env_logger = "0.11"
rfd = "0.17"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
naga = { version = "22", features = ["wgsl-in"] }

[build-dependencies]
cc = "1"
